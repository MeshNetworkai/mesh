<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b12" media="(prefers-color-scheme: dark)" />

    <title>Mesh — Trading pays for private AI</title>
    <meta name="description" content="Hold 1,000 $MESH and AI credits arrive every hour, paid for by trading fees. One OpenAI-compatible key for any model, served by Macs in the Mesh network. Credits are a share of fees, not a promise." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.example.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mesh" />
    <meta property="og:title" content="Mesh — Trading pays for private AI" />
    <meta property="og:description" content="Hold 1,000 $MESH and AI credits arrive every hour, paid for by trading fees. One API key for any model, served by Macs in the Mesh network." />
    <meta property="og:url" content="https://app.example.com/" />
    <meta property="og:image" content="https://app.example.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mesh: Trading pays for private AI. Hold, Earn, Ask." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mesh — Trading pays for private AI" />
    <meta name="twitter:description" content="Hold 1,000 $MESH and AI credits arrive every hour, paid for by trading fees. One API key for any model." />
    <meta name="twitter:image" content="https://app.example.com/og.png" />
    <meta name="twitter:image:alt" content="Mesh: Trading pays for private AI. Hold, Earn, Ask." />

    <script>
      try {
        var t = localStorage.getItem('mesh.theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
