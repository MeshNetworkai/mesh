[package]
name = "mesh-staking"
version = "0.1.0"
description = "Mesh ($MESH) staking tiers on Solana — position registry read by the gateway, no on-chain rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mesh_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
